name: "버그 신고 / Bug report"
description: "설치 오류나 예상과 다른 동작을 알려주세요. Report installation issues or unexpected behavior."
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "한국어 또는 영어로 작성하세요. Reports may be written in Korean or English. 이 게시물은 공개됩니다. 비공개 프로젝트 파일이나 민감한 로그는 첨부하지 마세요. Reports are public; do not attach private project files or sensitive logs."
  - type: input
    id: plugin_version
    attributes:
      label: "플러그인 버전 / Plugin version"
      placeholder: "예 / e.g. 1.5.0"
    validations:
      required: true
  - type: input
    id: engine_version
    attributes:
      label: "UE 버전과 엔진 종류 / UE version and engine type"
      placeholder: "예 / e.g. UE 5.7.x, Epic Games Launcher or custom source build"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: "운영체제·에디터 언어 / OS and Editor language"
      placeholder: "예 / e.g. Windows 11, Korean"
    validations:
      required: true
  - type: input
    id: archive
    attributes:
      label: "설치한 ZIP 이름 / Installed ZIP filename"
  - type: textarea
    id: reproduction
    attributes:
      label: "재현 순서 / Steps to reproduce"
      placeholder: "1. ...\n2. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "기대한 결과 / Expected behavior"
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: "실제 결과 / Actual behavior"
    validations:
      required: true
  - type: textarea
    id: attachments
    attributes:
      label: "추가 정보 / Additional context"
      description: "필요한 경우 공개 가능한 스크린샷과 오류 메시지를 첨부하세요. Optionally attach screenshots and error messages that can be shared publicly."
