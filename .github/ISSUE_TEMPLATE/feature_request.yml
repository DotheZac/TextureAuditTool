name: "기능 제안 / Feature request"
description: "새 기능이나 사용성 개선을 제안하세요. Suggest a feature or usability improvement."
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: "한국어 또는 영어로 작성하세요. Reports may be written in Korean or English. 제안은 공개됩니다. Suggestions are public."
  - type: textarea
    id: problem
    attributes:
      label: "어떤 작업에서 불편한가요? / What task is difficult?"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: "원하는 동작 / Proposed behavior"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: "사용 사례·대안 / Use cases and alternatives"
